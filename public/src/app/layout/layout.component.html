<div class="flex h-screen overflow-hidden bg-gray-50">
  <!-- Mobile backdrop -->
  @if (sidebarOpen()) {
    <div class="fixed inset-0 z-30 bg-black/40 lg:hidden" aria-hidden="true" (click)="closeSidebar()"></div>
  }

  <div
    class="fixed inset-y-0 left-0 z-40 w-64 transition-transform duration-200 lg:static lg:translate-x-0"
    [ngClass]="sidebarOpen() ? 'translate-x-0' : '-translate-x-full'"
  >
    <app-sidebar (navigate)="closeSidebar()" />
  </div>

  <div class="flex min-w-0 flex-1 flex-col">
    <app-header (menuToggle)="toggleSidebar()" />
    <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
      <router-outlet />
    </main>
  </div>
</div>
