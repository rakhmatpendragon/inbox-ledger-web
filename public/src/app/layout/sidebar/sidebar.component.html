<aside class="flex h-full w-[260px] flex-col gap-7 bg-canvas px-5 py-7">
  <div class="flex items-center gap-2.5">
    <app-logo />
    <span class="font-display text-lg font-bold text-gray-900">Inbox Ledger</span>
  </div>

  <nav class="flex flex-col gap-1" aria-label="Main navigation">
    @for (item of navItems; track item.route) {
      <a
        class="nav-link"
        [routerLink]="item.route"
        routerLinkActive="nav-link--active"
        ariaCurrentWhenActive="page"
        (click)="navigate.emit()"
      >
        {{ item.label }}
      </a>
    }
  </nav>

  @if (user$ | async; as user) {
    <div class="mt-auto flex items-center gap-2.5 border-t border-gray-200 pt-4">
      <span
        class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-gray-300 text-sm font-semibold text-gray-900"
        aria-hidden="true"
      >
        {{ user.displayName.charAt(0).toUpperCase() }}
      </span>
      <div class="flex min-w-0 flex-col">
        <span class="truncate text-sm font-semibold text-gray-900">{{ user.displayName }}</span>
        <span class="truncate text-xs text-gray-600">Signed in with Google</span>
      </div>
    </div>
  }
</aside>
