<div class="flex flex-col gap-1.5">
  <div class="flex flex-wrap items-baseline justify-between gap-x-4 gap-y-1 text-sm">
    <span class="font-medium text-gray-900">{{ budget.name }}</span>
    <span [ngClass]="isWarning ? 'text-warn-700' : 'text-gray-600'">
      {{ budget.used | currencyIdr }} / {{ budget.limit | currencyIdr }}
    </span>
  </div>

  <div
    class="h-2 w-full overflow-hidden rounded bg-gray-100"
    role="progressbar"
    aria-valuemin="0"
    aria-valuemax="100"
    [attr.aria-valuenow]="fill"
    [attr.aria-label]="budget.name + ' budget usage'"
  >
    <div
      class="h-full rounded transition-all duration-500"
      [ngClass]="isWarning ? 'bg-warn-600' : 'bg-brand-600'"
      [style.width.%]="fill"
    ></div>
  </div>

  @if (budget.alertSent) {
    <span class="text-xs text-warn-700">
      {{ usage | number: '1.0-0' }}% used — alert sent to your phone
    </span>
  }
</div>
