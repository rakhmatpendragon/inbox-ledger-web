@if (transactions.length) {
  <div class="overflow-x-auto">
    <table mat-table [dataSource]="transactions" [trackBy]="trackById" class="w-full">
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let tx" class="whitespace-nowrap text-gray-600">
          {{ tx.date | date: 'dd MMM, HH:mm' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="merchant">
        <th mat-header-cell *matHeaderCellDef>Merchant</th>
        <td mat-cell *matCellDef="let tx" class="font-medium text-gray-900">{{ tx.merchant }}</td>
      </ng-container>

      <ng-container matColumnDef="source">
        <th mat-header-cell *matHeaderCellDef>Source</th>
        <td mat-cell *matCellDef="let tx"><app-badge [label]="tx.source" /></td>
      </ng-container>

      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef>Category</th>
        <td mat-cell *matCellDef="let tx" class="whitespace-nowrap text-gray-600">{{ tx.category }}</td>
      </ng-container>

      <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef class="text-right">Amount</th>
        <td mat-cell *matCellDef="let tx" class="whitespace-nowrap text-right font-medium text-gray-900">
          {{ tx.amount | currencyIdr }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns" class="hover:bg-gray-50"></tr>
    </table>
  </div>
} @else {
  <app-empty-state icon="receipt_long" [title]="emptyTitle" [message]="emptyMessage" />
}
